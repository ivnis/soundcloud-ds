name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg g++
      - run: python -m pip install -r server/requirements-dev.txt
      - run: python -m pytest -q
      - run: g++ -std=c++17 -Wall -Wextra -Werror -Iclient/include tests/client_core.cpp client/source/http.cpp client/source/search.cpp client/source/keyboard.cpp client/source/endpoint.cpp client/source/artwork.cpp client/source/ui.cpp -o /tmp/core-tests && /tmp/core-tests

  nds:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C client
      - uses: actions/upload-artifact@v4
        with:
          name: release-rom
          path: client/soundcloud_ds.nds
          if-no-files-found: error

  publish:
    needs: [checks, nds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-rom
          path: dist/build
      - name: Check version and package separate downloads
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python tools/package_release.py --rom dist/build/soundcloud_ds.nds
          cd dist && sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/soundcloud-ds-${GITHUB_REF_NAME}.nds" \
            "dist/soundcloud-ds-server-${GITHUB_REF_NAME}.zip" \
            dist/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "${GITHUB_REF_NAME} - SoundCloud DS" \
            --notes-file "docs/RELEASE_${GITHUB_REF_NAME}.md"
